name: publish the Omaha / Lincoln chooser
# nebraska.here.events was Nebraska Events' host from 2026-10-12 to 2026-10-15;
# the calendar split into omaha.here.events and lincoln.here.events. This stub
# keeps the old host alive with a page that sends readers on (index.html,
# 404.html). Nothing is built; nothing runs on a schedule (this file replaced
# the daily build workflow). The retired build
# (scripts/, site/) stays in the repo for the history and is not published.
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out && cp index.html 404.html out/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
